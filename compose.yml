# Local development stack. The same hardening is applied by Terraform in staging
# (infra/terraform) and verified by the pipeline.
name: secure-delivery-lab

services:
  app:
    image: ${APP_IMAGE:-secure-delivery-lab:dev}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
