# Adds Prometheus and Grafana to the app stack:
#   GF_ADMIN_PASSWORD=<choose one> docker compose -f compose.yml -f compose.observability.yml up -d --build
services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    user: "65534:65534"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    user: "472:0"
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "127.0.0.1:3000:3000"
    secrets:
      - grafana_admin_password
    depends_on:
      - prometheus
    restart: unless-stopped

# The password is read from the GF_ADMIN_PASSWORD environment variable of the host shell and
# mounted as a file, so it never appears in `docker inspect` or in this repository.
secrets:
  grafana_admin_password:
    environment: GF_ADMIN_PASSWORD

volumes:
  prometheus-data:
  grafana-data:
