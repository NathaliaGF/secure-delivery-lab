name: pipeline

# build -> test -> security gates -> sign -> deploy to staging -> (approval) -> promote
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every third-party action below is pinned to a full commit SHA (the comment is the tag).
  # Dependabot proposes the updates.
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: app tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r app/requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q -c app/pyproject.toml --rootdir app app/tests --cov=app --cov-fail-under=95
      - name: Test the shell scripts
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck >/dev/null
          shellcheck scripts/*.sh
          ./scripts/test_scripts.sh

  iac:
    name: iac lint and scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Ansible lint (production profile)
        working-directory: ansible
        run: |
          python -m pip install --quiet ansible-core ansible-lint
          ansible-galaxy collection install -r requirements.yml
          ansible-lint
      - name: Terraform fmt and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      # Checkov has no checks for the Docker Terraform provider, so Terraform is covered by
      # fmt/validate and the variable validations above, not by Checkov.
      - name: Checkov (Dockerfile and workflows)
        run: |
          python -m pip install --quiet checkov
          checkov --quiet --compact --framework dockerfile github_actions \
            --directory . --skip-path ansible

  role-test:
    name: ansible role (Rocky Linux 9 container)
    runs-on: ubuntu-24.04
    env:
      ROCKY_IMAGE: rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Ansible
        working-directory: ansible
        run: |
          python -m pip install --quiet ansible-core
          ansible-galaxy collection install -r requirements.yml
      - name: Start a Rocky Linux 9 target
        run: docker run -d --name rocky --cap-add NET_ADMIN "$ROCKY_IMAGE" sleep infinity
      - name: Apply the role
        working-directory: ansible
        # The container is entered as root and has no sudo, systemd or SELinux: say so explicitly.
        run: ansible-playbook -i rocky, -c community.docker.docker playbooks/harden.yml -e rhel_cis_hardening_manage_services=false -e ansible_become=false
      - name: Apply again and require zero changes (idempotence)
        working-directory: ansible
        run: |
          ansible-playbook -i rocky, -c community.docker.docker playbooks/harden.yml -e rhel_cis_hardening_manage_services=false -e ansible_become=false | tee second-run.log
          grep -E 'rocky +: ok=[0-9]+ +changed=0 ' second-run.log
      - name: Verify the final state
        working-directory: ansible
        run: ansible-playbook -i rocky, -c community.docker.docker tests/verify.yml -e ansible_become=false

  build-and-gate:
    name: build, security gates, sign
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write          # push the image to GHCR (main only)
      security-events: write   # upload SARIF
      id-token: write          # keyless signing with Sigstore
      attestations: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      LOCAL_IMAGE: secure-delivery-lab:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}

      # ---- gates: the image is only pushed if every one of them passes ----
      - name: "Gate 1: Dockerfile and compose security (dockerscan)"
        uses: NathaliaGF/docker-security-scanner@6f5fed7d990e2506a95fc1c3a226e03806fac1e1 # main
        with:
          path: .
          fail-on: MEDIUM

      - name: "Gate 2: secrets in files and git history (secrets-scanner)"
        uses: NathaliaGF/secrets-scanner@4ed5f706ba5afd05123bd0696410aa012458a49d # v1.0.0
        with:
          git-history: "true"
          severity: MEDIUM
          sarif-file: secrets-scanner.sarif

      - name: "Gate 3: image vulnerabilities (Trivy, HIGH and CRITICAL with a fix)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Upload secrets-scanner SARIF
        if: always() && github.event_name != 'pull_request' && hashFiles('secrets-scanner.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        continue-on-error: true
        with:
          sarif_file: secrets-scanner.sarif
          category: secrets-scanner

      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json

      # ---- ship: only on main, and only the exact image that was scanned ----
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image and resolve its digest
        id: push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$LOCAL_IMAGE" "$repo:sha-${GITHUB_SHA::12}"
          docker push "$repo:sha-${GITHUB_SHA::12}"
          digest=$(docker inspect --format '{{ index .RepoDigests 0 }}' "$repo:sha-${GITHUB_SHA::12}")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $digest" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

      - name: Sign the image and attach the SBOM (keyless)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"

  staging:
    name: deploy to staging (Terraform) and smoke test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-and-gate, iac, role-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build-and-gate.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Verify the signature before deploying anything
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/pipeline.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE" > /dev/null
          echo "Signature verified for $IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Pull the verified digest
        run: docker pull "$IMAGE"

      - name: Terraform apply
        working-directory: infra/terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -var "app_image=$IMAGE" -var "app_version=${GITHUB_SHA::12}"

      - name: Smoke tests (app and Prometheus)
        run: |
          EXPECTED_VERSION="${GITHUB_SHA::12}" ./scripts/smoke.sh http://127.0.0.1:8080 http://127.0.0.1:9090

      - name: Verify the running app container is hardened
        run: ./scripts/verify-hardening.sh sdl-staging-app

      - name: Show logs on failure
        if: failure()
        run: docker logs sdl-staging-app 2>&1 | tail -50

      - name: Terraform destroy
        if: always()
        working-directory: infra/terraform
        run: terraform destroy -auto-approve -input=false -var "app_image=$IMAGE"

  promote:
    name: promote to production (manual approval)
    needs: [build-and-gate, staging]
    runs-on: ubuntu-24.04
    environment:
      name: production           # add required reviewers in Settings > Environments
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.build-and-gate.outputs.image }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify the signature again, then retag by digest
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/pipeline.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE" > /dev/null
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$repo:prod" "$IMAGE"
          echo "production now points to \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
