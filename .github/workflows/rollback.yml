name: rollback

# Points :prod back to a previous, signed image. Use the digest shown in the summary of an earlier
# pipeline run (promote job), or any sha-<commit> tag of a version that was already promoted.
# checkov:skip=CKV_GHA_7: the input only selects which already-built image :prod points to. It is
# validated as ghcr.io/...@sha256:<64 hex>, the image signature is verified against this repository's
# pipeline identity before the retag, and the job needs the production environment approval.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image digest to restore, e.g. ghcr.io/<owner>/secure-delivery-lab@sha256:<digest>"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-24.04
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Reject anything that is not pinned by digest
        run: |
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || { echo "image must be ghcr.io/...@sha256:<64 hex>"; exit 1; }
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify the signature, then retag
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/pipeline.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE" > /dev/null
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$repo:prod" "$IMAGE"
          echo "rolled back: production now points to \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
